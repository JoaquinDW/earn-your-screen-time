name: EarnYourScreenTime

options:
  bundleIdPrefix: com.balthasardeweert
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Keep signing here because XcodeGen replaces manual project.pbxproj changes.
    DEVELOPMENT_TEAM: F7RT2PJH7G
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  EarnDomain:
    path: Packages/EarnDomain
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.85.0

fileGroups:
  - StoreKit/EarnYourScreenTime.storekit

targets:
  EarnYourScreenTime:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: LiveActivitySupport
    dependencies:
      - package: EarnDomain
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
      - target: DeviceActivityMonitorExtension
        embed: true
      - target: ShieldConfigurationExtension
        embed: true
      - target: ShieldActionExtension
        embed: true
      - target: EarnLiveActivityExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.balthasardeweert.earnyourscreentime
        PRODUCT_NAME: Earnit
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/EarnYourScreenTime.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        # Supply the app's published legal pages through CI or an untracked xcconfig.
        TERMS_OF_USE_URL: "https://github.com/JoaquinDW/earn-your-screen-time/blob/main/TERMS.md"
        PRIVACY_POLICY_URL: "https://github.com/JoaquinDW/earn-your-screen-time/blob/main/PRIVACY.md"
      configs:
        # Public Test Store key. Release intentionally has no key until the Apple app is connected.
        Debug:
          REVENUECAT_API_KEY: test_WQzWgKDQJvCwnbkXvlBZisaXHwE
        Release:
          REVENUECAT_API_KEY: appl_VwoOkdJRRkvyFcadPsnkQUvgvOf

  DeviceActivityMonitorExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/DeviceActivityMonitor
      - path: Shared
    dependencies:
      - package: EarnDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.balthasardeweert.earnyourscreentime.monitor
        PRODUCT_NAME: DeviceActivityMonitorExtension
        INFOPLIST_FILE: Extensions/DeviceActivityMonitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/DeviceActivityMonitor/DeviceActivityMonitorExtension.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

  ShieldConfigurationExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldConfiguration
      - path: Shared/AppGroup.swift
      - path: Shared/SharedStore.swift
      - path: App/Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: EarnDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.balthasardeweert.earnyourscreentime.shieldconfiguration
        PRODUCT_NAME: ShieldConfigurationExtension
        INFOPLIST_FILE: Extensions/ShieldConfiguration/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/ShieldConfiguration/ShieldConfigurationExtension.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

  ShieldActionExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldAction
      - path: Shared/AppGroup.swift
      - path: Shared/ShieldLaunchIntent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.balthasardeweert.earnyourscreentime.shieldaction
        PRODUCT_NAME: ShieldActionExtension
        INFOPLIST_FILE: Extensions/ShieldAction/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/ShieldAction/ShieldActionExtension.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

  EarnLiveActivityExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/EarnLiveActivity
      - path: LiveActivitySupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.balthasardeweert.earnyourscreentime.liveactivity
        PRODUCT_NAME: EarnLiveActivityExtension
        INFOPLIST_FILE: Extensions/EarnLiveActivity/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

schemes:
  EarnYourScreenTime:
    build:
      targets:
        EarnYourScreenTime: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release

  EarnYourScreenTime StoreKit:
    build:
      targets:
        EarnYourScreenTime: all
    run:
      config: Debug
      storeKitConfiguration: StoreKit/EarnYourScreenTime.storekit
    test:
      config: Debug
    archive:
      config: Release
