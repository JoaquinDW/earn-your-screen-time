<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="light.css"><link rel="stylesheet" href="set.css"><style>.new-ui .nav-title{margin-bottom:22px}

ts</span></div><div class="ticks" data-p=".7" style="height:10px"></div><img class="squat-photo" src="squat.png" alt=""><p>Sit back and lower your hips</p></div>
