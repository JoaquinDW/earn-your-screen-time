<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="light.css"><link rel="stylesheet" href="set.css"><style>.friend-label{margin-top:28px}
  .friend-row{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid #6e97ff25}

  .friend-streak{display:flex;align-items:center;gap:3px;color:var(--cobalt-text);font-size:13px}
  .friend-streak svg{width:16px;height:18px}
  .friend-row p{font-size:12.5px;color:var(--muted);margin-top:5px}
  .nudge{color:var(--cobalt-text);width:40px;height:40px;padding:10px;border-radius:50%;background:#2e5ce622}
  .invite{margin-top:22px}
  .squad{background:var(--panel);border-radius:18px;padding:18px;margin-top:12px}
  .squad h2{font:26px "Instrument Serif";margin-bottom:8px}
  .standing{display:flex;gap:12px;padding-top:15px;font-size:14px}
  .standing b{color:var(--cobalt-text)}
  .standing span:last-child{margin-left:auto;color:var(--soft)}</style></head>
