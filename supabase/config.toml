project_id = "study-to-earn"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[studio]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

[functions.study-config]
verify_jwt = true

[functions.study-session]
verify_jwt = true

[functions.study-answer]
verify_jwt = true

[functions.pushups-config]
verify_jwt = true

[functions.pushups-start]
verify_jwt = true

[functions.pushups-claim]
verify_jwt = true

[functions.revenuecat-webhook]
verify_jwt = false
